services:
  - type: web
    name: phishlens
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PHISHLENS_DATABASE_URL
        sync: false
      - key: PHISHLENS_DATABASE_SSL_CA
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: PHISHTANK_APP_KEY
        sync: false
