services:
  - type: web
    name: phishlens
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: PHISHLENS_DATABASE_URL
        fromDatabase:
          name: phishlens-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
      - key: PHISHTANK_APP_KEY
        sync: false

databases:
  - name: phishlens-db
    plan: free
    databaseName: phishlens
    user: phishlens
    postgresMajorVersion: "16"
